name: ci

on:
  push:
    tags: "v*.*"

env:
  # github.repository is in the format "owner/repo"
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: dockerhub-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: linux-amd64
            cache: buildkit-linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
            cache: buildkit-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
          provenance: mode=max

      - name: Validate digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:([0-9a-f]{64})$ ]]; then
            printf 'Invalid image digest: %q\n' "$DIGEST" >&2
            exit 1
          fi

          printf 'hex=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          printf 'ref=%s@%s\n' "$IMAGE_NAME" "$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Smoke test published digest
        if: matrix.platform == 'linux/amd64'
        env:
          IMAGE: ${{ steps.digest.outputs.ref }}
        run: |
          for attempt in 1 2 3; do
            if docker pull --platform linux/amd64 "$IMAGE"; then
              break
            fi
            if (( attempt == 3 )); then
              echo "Unable to pull $IMAGE after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

          if output=$(docker run --rm --pull=never "$IMAGE" 2>&1); then
            echo "Expected the container to fail without required environment variables"
            exit 1
          fi
          if [[ "$output" != *"Error: TELEGRAM_API_ID is not set"* ]]; then
            echo "Missing TELEGRAM_API_ID error in container output"
            printf '%s\n' "$output"
            exit 1
          fi

          version=$(docker run --rm --pull=never "$IMAGE" ./telegram-bot-api --version 2>&1)
          if ! grep -qi "bot api" <<< "$version"; then
            echo "Unexpected telegram-bot-api version output"
            printf '%s\n' "$version"
            exit 1
          fi

      - name: Export digest
        env:
          DIGEST_HEX: ${{ steps.digest.outputs.hex }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          : > "$RUNNER_TEMP/digests/$DIGEST_HEX"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Create manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP"/digests/*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "Expected two platform digests, found ${#digest_files[@]}"
            exit 1
          fi

          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tag_args+=("-t" "$tag")
          done <<< "$TAGS"

          digest_args=()
          for digest_file in "${digest_files[@]}"; do
            digest=$(basename "$digest_file")
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid digest artifact: $digest"
              exit 1
            fi
            digest_args+=("${IMAGE_NAME}@sha256:$digest")
          done

          docker buildx imagetools create \
            --metadata-file "$RUNNER_TEMP/manifest-metadata.json" \
            "${tag_args[@]}" \
            "${digest_args[@]}"

      - name: Verify manifest
        env:
          MANIFEST: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          manifest_json=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$MANIFEST")

          if ! jq -e '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length) == 1 and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length) == 1 and
            ([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length) == 2
          ' <<< "$manifest_json" > /dev/null; then
            echo "Published manifest does not contain the expected platforms and attestations" >&2
            printf '%s\n' "$manifest_json"
            exit 1
          fi

          expected_digest=$(jq -r '.digest' <<< "$manifest_json")
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            actual_digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tag")
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "$tag points to $actual_digest instead of $expected_digest" >&2
              exit 1
            fi
          done <<< "$TAGS"

  dockerhub-description:
    needs: merge
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
